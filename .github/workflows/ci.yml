name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test generation client
        run: python -B -X utf8 -m unittest discover -s skills/hunyuan-3d-generator/scripts -p "test_*.py" -v
      - name: Test mesh client
        run: python -B -X utf8 -m unittest discover -s skills/hunyuan-3d-mesh/scripts -p "test_*.py" -v
      - name: Test material client
        run: python -B -X utf8 -m unittest discover -s skills/hunyuan-3d-material/scripts -p "test_*.py" -v
      - name: Test animation client
        run: python -B -X utf8 -m unittest discover -s skills/hunyuan-3d-animation/scripts -p "test_*.py" -v
